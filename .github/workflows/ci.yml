name: InIsai CI & Feature Presence Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Feature Presence Regression Guard against local build
        run: |
          npm run start -- -p 3000 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/version.json && break
            sleep 1
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npx playwright test e2e/feature-presence.spec.ts --project=desktop-dark --project=mobile-dark
          kill $SERVER_PID || true


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181526"/>
      <stop offset="50%" stop-color="#110E1D"/>
      <stop offset="100%" stop-color="#0A0911"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3D77" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FF3D77" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vinylGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="50%" stop-color="#FF3D77"/>
      <stop offset="100%" stop-color="#7A5CFF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="140" fill="url(#glow)"/>
  <!-- Vinyl Grooves -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="4"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="white" stroke-opacity="0.06" stroke-width="2"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="2"/>
  <!-- Center Vinyl Label -->
  <circle cx="256" cy="256" r="60" fill="url(#vinylGrad)"/>
  <circle cx="256" cy="256" r="16" fill="#0A0911"/>
</svg>

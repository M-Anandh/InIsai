<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191629"/>
      <stop offset="50%" stop-color="#120F1F"/>
      <stop offset="100%" stop-color="#0B0A13"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#20C7E8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#20C7E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20C7E8"/>
      <stop offset="50%" stop-color="#7A5CFF"/>
      <stop offset="100%" stop-color="#FF3D77"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="150" fill="url(#glow)"/>
  <!-- Playlist Lines and Note -->
  <rect x="140" y="170" width="232" height="24" rx="12" fill="url(#glyphGrad)"/>
  <rect x="140" y="226" width="160" height="24" rx="12" fill="url(#glyphGrad)" opacity="0.85"/>
  <rect x="140" y="282" width="120" height="24" rx="12" fill="url(#glyphGrad)" opacity="0.7"/>
  <!-- Play/Note badge -->
  <circle cx="340" cy="290" r="44" fill="url(#glyphGrad)"/>
  <polygon points="332,274 354,290 332,306" fill="#0B0A13"/>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InIsai (இனிசை) — Offline Mode</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #08090d;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
    }
    h1 {
      font-size: 24px;
      margin: 0 0 8px 0;
      font-weight: 800;
    }
    .tamil {
      color: #8b5cf6;
      font-weight: 600;
    }
    p {
      color: #8e95ab;
      font-size: 14px;
      max-width: 320px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #8b5cf6;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    }
    .local-link {
      margin-top: 16px;
      color: #06b6d4;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="icon">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l12-2v13"></path>
      <circle cx="6" cy="18" r="3"></circle>
      <circle cx="18" cy="16" r="3"></circle>
    </svg>
  </div>
  <h1>InIsai <span class="tamil">இனிசை</span></h1>
  <p>You appear to be offline. Online streaming catalogs are unavailable, but your saved local device audio files are ready to play.</p>
  <a href="/local" class="btn">Play Local Device Music</a>
  <a href="/" class="local-link">Try Reconnecting</a>
</body>
</html>
